[project]
name = "prosper-or-perish-static-modifiers"
version = "0.1.0"
description = "GAEZ v5 to EU5 location ETL and static GitHub Pages map browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "polars>=1.0",
  "rasterio>=1.3",
  "zipfile-deflate64>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
posm = "prosper_or_perish_static_modifiers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prosper_or_perish_static_modifiers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
